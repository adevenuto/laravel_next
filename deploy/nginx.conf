# /etc/nginx/sites-available/laravel_vue
#
# One vhost serves both apps on port 80:
#   /api/*, /sanctum/*  → Laravel via PHP-FPM (backend/public/index.php)
#   everything else     → Vue SPA (static files from /var/www/laravel_vue/client)
#
# Bootstrap script symlinks this file into sites-enabled.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/laravel_vue/backend/public;
    index index.php;

    client_max_body_size 20M;

    # Laravel routes — anything starting with /api or /sanctum
    location ~ ^/(api|sanctum)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM handler (Laravel's front controller)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Long-cache the Vite-fingerprinted SPA assets.
    # ^~ short-circuits regex matching so .js/.css aren't passed to PHP-FPM.
    location ^~ /assets/ {
        root /var/www/laravel_vue/client;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else → Vue SPA (client-side routing via index.html fallback)
    location / {
        root /var/www/laravel_vue/client;
        try_files $uri $uri/ /index.html;
    }

    # Deny dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
